info:
  name: create-user-request
  type: http

http:
  method: POST
  url: http://127.0.0.1:8000/api/users
  body:
    type: json
    data: |-
      {
        "email": "user2@example.com",
        "plainPassword": "123456",
        "firstname": "users2",
        "lastname": "example"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true




































































































































